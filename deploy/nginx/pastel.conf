# TAHAP 2 (nginx): HTTPS + reverse proxy ke Pastel di 127.0.0.1:8087.
# Butuh sertifikat dari TAHAP 1 (pastel.http-only.conf). Uji: nginx -t && systemctl reload nginx
# Hanya menambah server_name pastel.diatera.com; tidak mengubah situs lain di VPS.
# nginx < 1.25.1 (Ubuntu 22.04/24.04): `listen 443 ssl http2` seperti di bawah.
# nginx >= 1.25.1: boleh ganti dengan `listen 443 ssl;` + `http2 on;` (yang lama hanya memberi peringatan).

server {
    listen 80;
    listen [::]:80;
    server_name pastel.diatera.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pastel.diatera.com;

    ssl_certificate     /etc/letsencrypt/live/pastel.diatera.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pastel.diatera.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pastel_ssl:5m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    access_log /var/log/nginx/pastel.access.log;
    error_log  /var/log/nginx/pastel.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Timpa (bukan tambah) supaya klien tidak bisa memalsukan IP untuk rate limit login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
