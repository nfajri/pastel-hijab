# TAHAP 1 (nginx): hanya HTTP, untuk mengambil sertifikat Let's Encrypt lewat webroot.
# Pasang: /etc/nginx/sites-available/pastel.conf + symlink ke sites-enabled (atau /etc/nginx/conf.d/pastel.conf).
#   install -d /var/www/letsencrypt
#   nginx -t && systemctl reload nginx
#   certbot certonly --webroot -w /var/www/letsencrypt -d pastel.diatera.com \
#     --deploy-hook "systemctl reload nginx"
# Setelah sertifikat ada, ganti isi file dengan pastel.conf (TAHAP 2).
server {
    listen 80;
    listen [::]:80;
    server_name pastel.diatera.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 404;
    }
}
